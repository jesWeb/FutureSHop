<h1 class="text-2xl fotn-bold">Listado de Productos</h1>
<h3 class="text-lg">
  Total de productos
  <span class="text-accent">{{ productsResource.value()?.count }}</span>
</h3>

<div class="divider"></div>

<div class="flex gap-2 items-center h-20">
  <app-pagination
    [pages]="productsResource.value()?.pages ?? 0"
    [currentPage]="paginationServ.currentPage()"
  />

  <!-- referencia local -->
  <select
    class="select select-bordered w-32"
    (change)="productsPerPage.set(+selectPerPage.value)"
    #selectPerPage
  >
    <option value="10">10</option>
    <option value="20">20</option>
    <option value="30">50</option>
    <option value="100">100</option>
  </select>

  <button class="btn btn-primary" routerLink="/admin/products/new">Nuevo producto</button>
</div>

<!-- listadp -->
<product-table [products]="productsResource.value()?.products ?? []" />
